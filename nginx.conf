server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # hashed build assets: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (history routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml font/woff2;

    client_max_body_size 64m;
}
